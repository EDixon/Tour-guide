<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4d3a">
  <meta name="description" content="Dynamic self-guided tours that re-plan as your day changes.">
  <title>Tour Guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <div class="top-row">
      <div class="title" id="title">Tour Guide</div>
      <div class="top-btns">
        <button class="icon-btn" id="btn-ask" aria-label="Ask">💬</button>
        <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙︎</button>
      </div>
    </div>
    <div class="status" id="status"></div>
  </header>

  <nav id="tabs" role="tablist">
    <button data-tab="now" class="active">Now</button>
    <button data-tab="map">Map</button>
    <button data-tab="time">Timeline</button>
    <button data-tab="plan">Plan</button>
  </nav>

  <main id="view"></main>

  <footer id="actions">
    <button data-act="bored"><span>😴</span>Bored</button>
    <button data-act="loving"><span>😀</span>Loving it</button>
    <button data-act="loo"><span>🚻</span>Loo</button>
    <button data-act="coffee"><span>☕</span>Coffee</button>
    <button data-act="leave"><span>🕒</span>Leave by</button>
  </footer>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="sheet-body" id="sheet-body"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
