name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace 2>&1 | tee ../build.log

      # Build logs can't be downloaded from Claude's workspace, so on failure surface the key lines as
      # annotations and push the full log to the ci-logs branch.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Execution failed|> " build.log | grep -v "^> Task" | head -10 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/ci && cp build.log /tmp/ci/
          git checkout --orphan ci-logs && git rm -rf --cached . -q && git clean -fdq -e build.log
          mkdir -p logs && cp /tmp/ci/build.log logs/build-${{ github.run_number }}.log
          git add logs && git commit -qm "Build log ${{ github.run_number }}" && git push -qf origin ci-logs

      - name: Show what was resolved
        working-directory: android
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath | grep -i litertlm | head -5 || true

      - name: Check the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' | head -20

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TourGuide.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest TourGuide.apk \
            --title "Tour Guide Android app (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. On the phone: open this page, download TourGuide.apk, and install it (allow installs from Chrome when asked). Each new build installs over the previous one." \
            --latest
