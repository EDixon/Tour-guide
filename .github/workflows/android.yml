name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Show what was resolved
        working-directory: android
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath | grep -i litertlm | head -5 || true

      - name: Check the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' | head -20

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TourGuide.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest TourGuide.apk \
            --title "Tour Guide Android app (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. On the phone: open this page, download TourGuide.apk, and install it (allow installs from Chrome when asked). Each new build installs over the previous one." \
            --latest
